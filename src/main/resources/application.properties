spring.application.name=internship-manager
spring.config.import=optional:file:.env[.properties]

# Database Configuration with Auto-Create
# The 'createDatabaseIfNotExist=true' flag ensures the schema exists on startup
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:internship_management_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Allow overriding for flexible testing/mocking
spring.main.allow-bean-definition-overriding=true
# JWT Configuration
# Use a 64-character hex string for the secret
jwt.secret=${JWT_SECRET}
jwt.expiration=10368000000

# Use variables from .env when present; defaults keep local startup working without mail credentials
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:pfaservice2012@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}

# These are safe to stay here as they aren't sensitive
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS_ENABLE:false}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS_REQUIRED:false}
spring.mail.protocol=smtp
spring.mail.properties.mail.debug=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${MAIL_FROM:pfaservice2012@gmail.com}
app.reminders.enabled=${REMINDER_ENABLED:true}
app.reminders.window-hours=${REMINDER_WINDOW_HOURS:24}
app.reminders.cron=${REMINDER_CRON:0 0 * * * *}
openai.enabled=${OPENAI_ENABLED:false}
openai.api-key=${OPENAI_API_KEY:}
openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
openai.model=${OPENAI_MODEL:gpt-4.1-mini}
openai.chatbot-system-prompt=${OPENAI_CHATBOT_SYSTEM_PROMPT:Tu es l assistant officiel IIT StageManager. Tu aides les etudiants, enseignants et administrateurs a utiliser la plateforme, tu reponds de maniere claire et concise, et tu ne proposes jamais de creation ou modification automatique sans demander explicitement une confirmation.}
# Storage Configuration
storage.provider=local
storage.local.upload-dir=uploads/internship-documents
