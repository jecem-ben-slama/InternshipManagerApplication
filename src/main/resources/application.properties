spring.application.name=internship-manager
spring.config.import=optional:file:.env[.properties]

# Database Configuration with Auto-Create
# The 'createDatabaseIfNotExist=true' flag ensures the schema exists on startup
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:internship_management_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Allow overriding for flexible testing/mocking
spring.main.allow-bean-definition-overriding=true
# JWT Configuration
# Use a 64-character hex string for the secret
jwt.secret=${JWT_SECRET}
jwt.expiration=10368000000

# Use variables from .env when present; defaults keep local startup working without mail credentials
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

# These are safe to stay here as they aren't sensitive
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.starttls.required=false
spring.mail.protocol=smtp
spring.mail.properties.mail.debug=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=5000
# Storage Configuration
storage.provider=local
storage.local.upload-dir=uploads/internship-documents
