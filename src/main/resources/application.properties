spring.application.name=internship-manager

# Database Configuration with Auto-Create
# The 'createDatabaseIfNotExist=true' flag ensures the schema exists on startup
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:internship_management_db}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Allow overriding for flexible testing/mocking
spring.main.allow-bean-definition-overriding=true
# JWT Configuration
# Use a 64-character hex string for the secret
jwt.secret=${Jwt_Secret}
jwt.expiration=10368000000
