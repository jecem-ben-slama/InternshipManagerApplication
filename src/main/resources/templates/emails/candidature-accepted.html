<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <style>
        body {
            font-family: sans-serif;
            color: #333;
        }

        .box {
            border: 1px solid #4caf50;
            padding: 20px;
            border-radius: 10px;
        }

        .green {
            color: #2e7d32;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="box">
        <h2 class="green">Congratulations!</h2>
        <p>Your application for the internship topic <strong><span th:text="${sujet}"></span></strong>
            has been accepted by <strong>Mr/Mme <span th:text="${teacherName}"></span></strong>.</p>
        <p>You can now log in to the portal to view your official affectation.</p>
        <hr>
        <p style="font-size: 11px;">IIT Sfax - Computer Engineering Department</p>
    </div>
</body>

</html>
