<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
        }

        .container {
            width: 80%;
            margin: 20px auto;
            padding: 20px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
        }

        .header {
            color: #2e7d32;
            border-bottom: 2px solid #2e7d32;
            padding-bottom: 10px;
        }

        .details {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 5px;
            margin: 20px 0;
        }

        .footer {
            font-size: 12px;
            color: #777;
            margin-top: 30px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2 class="header">Meeting Confirmed</h2>
        <p>Hello,</p>
        <p>Your meeting request has been <strong>confirmed</strong> by <span th:text="${creator}"></span>.</p>

        <div class="details">
            <p><strong>Subject:</strong> <span th:text="${objet}"></span></p>
            <p><strong>Date & Time:</strong> <span th:text="${date}"></span></p>
            <p><strong>Location:</strong> <span th:text="${lieu}"></span></p>
        </div>

        <p>Please find the <code>.ics</code> calendar invitation attached to this email to add this event to your
            calendar.</p>

        <div class="footer">
            <p>Sent via IIT Internship Management System</p>
        </div>
    </div>
</body>

</html>
