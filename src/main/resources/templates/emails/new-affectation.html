<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            line-height: 1.6;
            color: #333;
        }

        .container {
            width: 85%;
            margin: 20px auto;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        .header {
            color: #1976d2;
            border-bottom: 2px solid #1976d2;
        }

        .highlight {
            font-weight: bold;
            color: #d32f2f;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2 class="header">New Internship Affectation Created</h2>
        <p>Hello Responsable PFE,</p>
        <p>A new affectation has been registered in the system:</p>
        <ul>
            <li><strong>Supervisor:</strong> <span th:text="${supervisorName}"></span></li>
            <li><strong>Student Group:</strong> <span th:text="${groupName}"></span></li>
            <li><strong>Topic/Subject:</strong> <span th:text="${sujet}"></span></li>
        </ul>
        <p>Please log in to the portal to review or manage this affectation.</p>
        <div class="footer">
            <p>IIT Sfax - Internship Management System</p>
        </div>
    </div>
</body>

</html>
